<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Sravani 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="bg"><img src="assets/background.jpg" alt=""></div>
<div id="dark"></div>
<div id="lights"></div>
<div id="hello"><h1>Hey <span class="nm"></span> 💖</h1><p class="sub">It’s dark out here on the beach…<br>can you help me turn the lights on? ✨</p></div>

<div class="dc pole" style="left:3vw"></div><div class="dc pole" style="right:3vw"></div><div class="dc" id="beam"></div>
<img class="dc" id="banner" alt="">
<div class="dc gar" style="left:calc(3vw + 8px)">🌸<br>🌺<br>🌼<br>🌸<br>🌺<br>🌼</div><div class="dc gar" style="right:calc(3vw + 8px);animation-delay:-2s">🌼<br>🌺<br>🌸<br>🌼<br>🌺<br>🌸</div>
<div class="dc tk" style="left:calc(3vw + 24px)"></div><div class="dc tk" style="right:calc(3vw + 24px)"></div>
<div class="dc bb" style="left:calc(3vw + 28px);top:calc(env(safe-area-inset-top,0px) + 190px)"><img data-b="1" alt=""></div><div class="dc bb" style="right:calc(3vw + 28px);top:calc(env(safe-area-inset-top,0px) + 190px)"><img data-b="3" alt=""></div>
<div class="dc" id="sign">Happy Birthday<br><span class="nm"></span> 🌺</div><div class="dc" id="gifts">🎁🎀</div>
<canvas id="fx"></canvas><canvas id="cf"></canvas>
<audio id="au" loop src="assets/music.mp3"></audio>
<button id="mute">🔊</button>

<div id="cs"><div class="bub" id="say">…</div><div id="ck"><div id="cb"><div class="cwrap"><img src="assets/cake.jpg" alt=""><div class="cutin"></div></div><div class="wedge"></div><div class="cd" style="left:56%;top:20%"><i></i><b></b></div><div class="cd" style="left:62%;top:18.5%"><i></i><b></b></div><div class="cd" style="left:68%;top:18.5%"><i></i><b></b></div><div class="cd" style="left:74%;top:20%"><i></i><b></b></div></div></div></div>
<div id="pop"><h1>🎉 Happy Birthday <span class="nm"></span>! 🎂</h1></div>
<div id="azp"><h2>A to Z of <span class="nm"></span> 💖</h2><div class="az" id="az"></div></div>
<div id="envw"><p class="sub" id="eh">💌 A letter for you… tap to open</p><div class="env" id="env"><div class="card">For <span class="nm"></span></div><div class="pk"></div><div class="flap"></div><div class="seal">💌</div></div></div>
<div id="paperw"><div class="paper" id="paper"><button id="x" aria-label="Close">✕</button><img id="chr" src="assets/portrait.jpg" alt=""><h3>Dear <span class="nm"></span>,</h3></div></div>
<div id="bar"><button class="btn" id="act"></button><div id="stp"></div></div>

<script src="config.js"></script>
<script src="script.js"></script></body></html>
